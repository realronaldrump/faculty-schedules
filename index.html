<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HSD Dashboard" />
  <meta name="author" content="Baylor University - Human Sciences & Design" />
  <meta name="theme-color" content="#154734" />

  <!-- Baylor University Branding -->
  <title>HSD Dashboard | Baylor University</title>

  <!-- Adobe Fonts: Calluna (font files are fetched cross-origin) -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/ymh8ltu.css">

  <!-- Security and Performance -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">

  <!-- Professional Favicon -->
  <link rel="manifest" href="/site.webmanifest">

  <!-- Loading Styles -->
  <style>
    /* Critical loading styles with Baylor branding */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #154734 0%, #1a5a42 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: white;
      font-family: "calluna", serif;
      transition: opacity 0.3s ease, visibility 0s linear 0.3s;
    }

    .loading-content {
      text-align: center;
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      backdrop-filter: blur(10px);
      animation: pulse 2s infinite;
    }

    .loading-text {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: white;
    }

    .loading-subtitle {
      font-size: 14px;
      color: #FFB81C;
      opacity: 0.9;
      margin-bottom: 32px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #FFB81C;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Fade out once the app knows who is signed in (set in main.jsx) */
    .app-loaded #loading-screen {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- Professional Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-logo">
        <span style="font-size: 16px; font-weight: bold;">HSD</span>
      </div>
      <div class="loading-text">HSD Dashboard</div>
      <div class="loading-subtitle">Baylor University – Human Sciences &amp; Design</div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- Main Application Root -->
  <div id="root"></div>

  <!-- Application Script -->
  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
